<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homepage</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(to bottom, #fcf6ed, #fcf6ed);
      }
      .navbar {
        display: flex;
        grid-template-columns: auto 1fr;
        align-items: center;
        justify-content: space-between;
        background-color: #3b507d;
        padding: 0.3em 1em;
      }
      h1 {
        font-size: xx-large;
        font-weight: bold;
        color: #fcf6ed;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #3b507d;
        border: none;
      }
      #Home:hover {
        font-size: large;
        background-color: #fcf6ed;
        color: #3b507d;
        font-weight: bold;
        border: none;
        border-radius: 1em;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      #Home {
        font-size: large;
        background-color: #3b507d;
        color: #fcf6ed;
        font-weight: bold;
        border: none;
        border-radius: 1em;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      #Hobbies:hover {
        font-size: large;
        background-color: #fcf6ed;
        color: #3b507d;
        font-weight: bold;
        border: none;
        border-radius: 1em;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      #Hobbies {
        font-size: large;
        background-color: #3b507d;
        color: #fcf6ed;
        font-weight: bold;
        border: none;
        border-radius: 1em;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      #Achievements:hover {
        font-size: large;
        background-color: #fcf6ed;
        color: #3b507d;
        font-weight: bold;
        border: none;
        border-radius: 1em;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      #Achievements {
        font-size: large;
        background-color: #3b507d;
        color: #fcf6ed;
        font-weight: bold;
        border: none;
        border-radius: 1em;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      .Headline {
        font-size: 5em;
        font-weight: bold;
        display: flex;
        position: relative;
        top: 1.3em;
        margin-left: 2em;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      #Engineer {
        font-size: 1.5em;
        font-weight: bold;
        display: flex;
        position: relative;
        top: 2.5em;
        margin-left: 6.89em;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        padding: 0.2em;
        width: fit-content;
        height: fit-content;
        background-color: #3b507d;
        color: #fcf6ed;
      }
    </style>
  </head>
  <body>
    <div>
      <nav class="navbar">
        <h1>About Me</h1>
        <div>
          <input
            type="button"
            value="Home"
            id="Home"
            onclick="Home()"
          />
          <input
            type="button"
            value="Hobbies"
            id="Hobbies"
            onclick="Hobbies()"
          />
          <input
            type="button"
            value="Achievements"
            id="Achievements"
            onclick="Achievements()"
          />
        </div>
      </nav>
      <div>
        <span class="Headline">Hello,</span>
        <span class="Headline">I'm Samuel</span>
        <br /><br /><br />
        <span id="Engineer">Welcome to my Web Page!</span>
      </div>
    </div>
    <script>
      function Home(){
        window.location.href = "/";
      }
      function AboutMe(){
        window.location.href = "/about";
      }
      function Hobbies(){
        window.location.href = "/hobbies";
      }
      function Achievements(){
        window.location.href = "/achievement";
      }
    </script>
  </body>
</html>
