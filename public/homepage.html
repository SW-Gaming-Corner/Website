<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homepage</title>

    <style>
      @keyframes easeInFromBottom {
        from {
          opacity: 0;
          transform: translateY(15px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(to bottom, #fcf6ed, #fcf6ed);
        overflow-x: hidden;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .navbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background-color: #3b507d;
        padding: 1em 1em;
        position: sticky;
        top: 0;
        z-index: 9999;
      }

      .nav-links {
        display: flex;
        gap: 1em;
      }

      #Portfolio {
        font-size: xx-large;
        font-weight: bold;
        color: #fcf6ed;
        background-color: #3b507d;
        border: none;
        cursor: pointer;
        display: inline-block;
        transition:
          transform 0.25s ease 0.1s,
          background-color 0.25s ease 0.1s,
          color 0.25s ease 0.1s;
        will-change: transform;
      }

      #Portfolio:hover {
        transform: translateY(-6px);
      }

      #About_Me,
      #Hobbies,
      #Projects,
      #Achievements {
        font-size: large;
        background-color: #3b507d;
        color: #fcf6ed;
        font-weight: bold;
        border: none;
        border-radius: 1em;
        padding: 0.4em 0.8em;
        cursor: pointer;
        display: inline-block;
        transition:
          transform 0.25s ease 0.1s,
          background-color 0.25s ease 0.1s,
          color 0.25s ease 0.1s;
        will-change: transform;
      }

      #About_Me:hover,
      #Hobbies:hover,
      #Projects:hover,
      #Achievements:hover {
        background-color: #fcf6ed;
        color: #3b507d;
        transform: translateY(-6px);
      }

      .hero {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        padding: 6em 8em;
        gap: 3em;
      }

      .text-column {
        margin-top: 5em;
      }
      .Headline {
        font-size: 5em;
        font-weight: bold;
        line-height: 1.1;
        display: block;
        opacity: 0;
        animation: easeInFromBottom 0.7s ease forwards;
      }

      .Headline:nth-of-type(1) {
        animation-delay: 0s;
      }

      .Headline:nth-of-type(2) {
        animation-delay: 0.5s;
      }

      #Engineer {
        font-size: 1.5em;
        font-weight: bold;
        display: inline-block;
        margin-top: 1.5em;
        padding: 0.3em 0.6em;
        background-color: #3b507d;
        color: #fcf6ed;
      }

      #Subtitle {
        font-size: 1.3em;
        font-weight: bold;
        display: block;
        margin-top: 1em;
      }
      .Contact {
        display: flex;
        align-items: center;
        gap: 0.5em;
        margin-top: 0.8em;
        flex-wrap: wrap;
      }

      .Contact img,
      .EmailIcon {
        width: 2em;
        height: 2em;
        object-fit: contain;
        display: block;
      }

      .ContactNumber,
      .EmailAddress {
        font-size: 1.2em;
        font-weight: bold;
        color: #3b507d;
        text-decoration: none;
      }

      .ContactNumber:hover,
      .EmailAddress:hover {
        text-decoration: underline;
      }

      .EmailIcon {
        margin-left: 2em; /* space between phone number and email icon */
      }
      .media-column {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.2em;
      }

      .slider-window {
        width: 30em;
        border-color: #3b507d;
        border-radius: 10%;
        overflow: hidden;
      }

      .slider-track {
        display: flex;
        width: 100%;
        height: 100%;
        transition: transform 0.45s cubic-bezier(0.25, 1, 0.5, 1);
      }

      .slider-track img {
        width: 30em;
        height: 30em;
        flex-shrink: 0;
        object-fit: cover;
      }

      .nav-buttons {
        display: flex;
        gap: 1.5em;
      }

      #First,
      #Second,
      #Third,
      #Fourth {
        font-size: large;
        height: 0.2em;
        width: 4em;
        background-color: #3b507d;
        color: #fcf6ed;
        font-weight: bold;
        border: 2px solid #3b507d;
        border-radius: 1.5em;
        padding: 0.2em 1em;
        display: inline-block;
        cursor: pointer;
        transition:
          transform 0.25s ease,
          background-color 0.25s ease,
          color 0.25s ease;
        will-change: transform;
      }

      #First:hover,
      #Second:hover,
      #Third:hover,
      #Fourth:hover {
        background-color: #fcf6ed;
        color: #3b507d;
        transform: translateY(-4px);
      }
    </style>
  </head>

  <body>
    <nav class="navbar">
      <input type="button" value="Portfolio" id="Portfolio" onclick="Home()" />

      <div class="nav-links">
        <input type="button" value="About" id="About_Me" onclick="AboutMe()" />

        <input
          type="button"
          value="Achievements"
          id="Achievements"
          onclick="Achievements()"
        />

        <input
          type="button"
          value="Projects"
          id="Projects"
          onclick="Projects()"
        />

        <input type="button" value="Hobbies" id="Hobbies" onclick="Hobbies()" />
      </div>
    </nav>

    <div class="hero">
      <div class="text-column">
        <span class="Headline">Hello,</span>
        <span class="Headline">I'm Samuel</span>

        <span id="Engineer">Welcome to my Web Page!</span>

        <span id="Subtitle">
          This is a personal portfolio website to learn more about me!
        </span>
        <div class="Contact">
          <img src="images/phone symbol.png" alt="Phone" />
          <a class="ContactNumber">+65 8875 1553</a>

          <img src="images/Email symbol.png" alt="Email" class="EmailIcon" />
          <a class="EmailAddress">samuelwon5528@gmail.com</a>
        </div>
      </div>

      <div class="media-column">
        <div class="slider-window">
          <div class="slider-track" id="slider-track">
            <img src="images/portfolio pic.jpeg" alt="Samuel Won" />
            <img src="images/portfolio pic 2.jpeg" alt="Samuel Won" />
            <img src="images/portfolio pic 3.jpeg" alt="Samuel Won" />
            <img src="images/portfolio pic 4.jpeg" alt="Samuel Won" />
          </div>
        </div>

        <div class="nav-buttons">
          <input type="button" value="" id="First" onclick="First()" />
          <input type="button" value="" id="Second" onclick="Second()" />
          <input type="button" value="" id="Third" onclick="Third()" />
          <input type="button" value="" id="Fourth" onclick="Fourth()" />
        </div>
      </div>
    </div>

    <script>
      function Home() {
        location.reload();
      }

      function AboutMe() {
        window.location.href = "/about";
      }

      function Achievements() {
        window.location.href = "/achievement";
      }

      function Hobbies() {
        window.location.href = "/hobbies";
      }

      function Projects() {
        window.location.href = "/projects";
      }

      const track = document.getElementById("slider-track");
      let currentIndex = 0;

      function updateSlide() {
        track.style.transform = `translateX(-${currentIndex * 100}%)`;
      }

      function First() {
        currentIndex = 0;
        updateSlide();
      }

      function Second() {
        currentIndex = 1;
        updateSlide();
      }

      function Third() {
        currentIndex = 2;
        updateSlide();
      }

      function Fourth() {
        currentIndex = 3;
        updateSlide();
      }
    </script>
  </body>
</html>
